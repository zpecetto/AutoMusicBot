services:
  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:latest}
    container_name: n8n
    restart: always
    ports:
    - 5678:5678
    extra_hosts:
    - host.docker.internal:host-gateway
    environment:
    - N8N_SECURE_COOKIE=false
    - NODE_FUNCTION_ALLOW_ENV=N8N_VERSION
    - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
    - N8N_BLOCK_BROWSER_NAME_CHECK=true
    - N8N_COMMAND_EXECUTION_ENABLED=true
    - NODE_FUNCTION_ALLOW_BUILTIN=*
    - GENERIC_TIMEZONE=Europe/Paris
    - N8N_RUNNERS_TASK_TIMEOUT=3600
    - N8N_AI_TIMEOUT=3600000
    - N8N_RECURSION_LIMIT=50
    volumes:
    - n8n_data:/home/node/.n8n
    - ${MUSIC_HOST_DIR:-./Musique}:/home/node/.n8n-files
    deploy:
      resources:
        limits:
          memory: 4G
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    ports:
    - 11434:11434
    volumes:
    - ./ollama_data:/root/.ollama
    environment:
    - OLLAMA_ORIGINS=*
    deploy:
      resources:
        limits:
          memory: 8G
volumes:
  n8n_data: {}
